[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igors"
version = "2.0.0"
description = "IGORS - Information de Gestion des Opérations de Routage et de Suivi pour le CNTS Côte d'Ivoire"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "CNTS CI", email = "contact@cnts.ci"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Database & ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    
    # Security
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # GUI
    "PyQt6>=6.6.0",
    "PyQt6-Qt6>=6.6.0",
    
    # Settings & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Reporting
    "reportlab>=4.0.0",
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
    
    # Logging & Monitoring
    "loguru>=0.7.0",
    
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
igors-ui = "igors.ui.app:main"
igors-api = "igors.api.main:run_server"
igors-migrate = "igors.infrastructure.database.migrations:run_migrations"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
